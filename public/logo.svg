<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark slate background match -->
  <rect width="100%" height="100%" fill="#030712" rx="40" />

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="160" fill="url(#brand-grad)" opacity="0.15" filter="url(#glow)" />

  <g transform="translate(0, 0)">
    <!-- Hexagon Outer Outline -->
    <path 
      d="M 250,88 L 412,169 L 412,331 L 250,412 L 88,331 L 88,169 Z" 
      fill="none" 
      stroke="url(#brand-grad)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      filter="url(#glow)"
    />
    
    <!-- Hexagon Inner Facets (3D Isometric Cube effect) -->
    <path 
      d="M 250,250 L 412,169" 
      fill="none" 
      stroke="url(#brand-grad)" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.85"
    />
    <path 
      d="M 250,250 L 250,412" 
      fill="none" 
      stroke="url(#brand-grad)" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.85"
    />
    <path 
      d="M 250,250 L 88,169" 
      fill="none" 
      stroke="url(#brand-grad)" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.85"
    />
  </g>
</svg>
