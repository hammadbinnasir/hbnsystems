<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark slate background match -->
  <rect width="100%" height="100%" fill="#030712" rx="20" />

  <!-- Logo Icon -->
  <g transform="translate(40, 35) scale(0.26)">
    <!-- Hexagon Outer Outline -->
    <path 
      d="M 250,88 L 412,169 L 412,331 L 250,412 L 88,331 L 88,169 Z" 
      fill="none" 
      stroke="url(#brand-grad)" 
      stroke-width="20" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      filter="url(#glow)"
    />
    
    <!-- Hexagon Inner Facets (3D Isometric Cube effect) -->
    <path 
      d="M 250,250 L 412,169" 
      fill="none" 
      stroke="url(#brand-grad)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <path 
      d="M 250,250 L 250,412" 
      fill="none" 
      stroke="url(#brand-grad)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <path 
      d="M 250,250 L 88,169" 
      fill="none" 
      stroke="url(#brand-grad)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>

  <!-- Brand Text -->
  <g transform="translate(190, 105)">
    <!-- "HBN SYSTEMS" Title -->
    <text 
      font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" 
      font-size="64" 
      font-weight="800" 
      fill="#ffffff" 
      letter-spacing="-1.5"
    >
      HBN<tspan fill="url(#brand-grad)" font-weight="900">SYSTEMS</tspan>
    </text>
    
    <!-- "ENGINEERING EXCELLENCE" Subtitle -->
    <text 
      y="40" 
      font-family="'JetBrains Mono', 'Courier New', monospace" 
      font-size="16" 
      font-weight="700" 
      fill="#06b6d4" 
      opacity="0.8" 
      letter-spacing="6"
    >
      ENGINEERING EXCELLENCE
    </text>
  </g>
</svg>
